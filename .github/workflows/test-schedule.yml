name: 'Test Scheduled'
on:
  schedule:
    - cron: '*/30 * * * *' # every 30 minutes
  workflow_dispatch:

jobs:
  check_schedule_window:
    runs-on: ubuntu-latest
    outputs:
      in_window: ${{ steps.check.outputs.in_window }}
    steps:
      - id: check
        run: |
          day=$(date -u +%-d)
          echo "day = $day"
          if [ "$day" -eq 1 ]; then
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "in_window = false (day is the 1st)"
          else
            echo "in_window=true" >> "$GITHUB_OUTPUT"
            echo "in_window = true"
          fi

  testing:
    runs-on: ubuntu-latest
    needs: check_schedule_window
    steps:
      - uses: actions/checkout@v4
      - name: Print event context
        run: |
          echo "github.event_name = ${{ github.event_name }}"
          echo "github.event_name != 'schedule' = ${{ github.event_name != 'schedule' }}"
          echo "github.event_name == 'schedule' = ${{ github.event_name == 'schedule' }}"
          echo "in_window (from check_schedule_window) = ${{ needs.check_schedule_window.outputs.in_window }}"
          echo "in_window == 'true'  = ${{ needs.check_schedule_window.outputs.in_window == 'true' }}"
          echo "in_window == 'false' = ${{ needs.check_schedule_window.outputs.in_window == 'false' }}"
          echo "now (UTC) = $(date -u)"
          echo "::group::github.event payload"
          cat <<'EOF'
          ${{ toJSON(github.event) }}
          EOF
          echo "::endgroup::"
      - run: echo "Hello World"
